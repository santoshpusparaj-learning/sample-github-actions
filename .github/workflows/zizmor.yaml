name: Zizmor GitHub Actions Security Scan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'

  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Scan GitHub Actions Security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          inputs: .
